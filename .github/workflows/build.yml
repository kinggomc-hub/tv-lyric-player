name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 직접 빌드 버튼을 누를 수 있게 해주는 옵션

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 코르도바 프로젝트 생성 및 빌드
        run: |
          npm install -g cordova
          # 새 코르도바 앱 뼈대 생성 (패키지명: com.tv.musicplayer, 앱이름: TVMusicPlayer)
          cordova create build_dir com.tv.musicplayer "TVMusicPlayer"
          
          # 업로드한 소스코드(HTML 등)를 코르도바 www 폴더로 복사
          rsync -av --exclude='build_dir' --exclude='.git' --exclude='.github' ./ build_dir/www/
          
          cd build_dir
          cordova platform add android
          cordova build android --debug

      - name: 빌드된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: TV-Music-Player-APK
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
